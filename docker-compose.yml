services:
  lost-and-found:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lost-and-found-app
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=production
      - PORT=5002
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
    volumes:
      - ./lostfound.db:/app/lostfound.db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:5002/api/items', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lost-and-found-network

networks:
  lost-and-found-network:
    driver: bridge
